<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" role="img" aria-label="engage">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0F2136"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DE9FB"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- panel -->
  <rect x="1" y="1" width="598" height="198" rx="24" fill="url(#bg)" stroke="#FFFFFF" stroke-opacity="0.07"/>

  <!-- stars -->
  <circle cx="300" cy="30" r="1.1" fill="#CFE8FF" opacity="0.5"/>
  <circle cx="500" cy="44" r="1.4" fill="#CFE8FF" opacity="0.45"/>
  <circle cx="548" cy="150" r="1.1" fill="#CFE8FF" opacity="0.4"/>

  <!-- glow behind mark -->
  <ellipse cx="118" cy="100" rx="86" ry="66" fill="url(#glow)"/>

  <!-- warp streaks -->
  <rect x="34" y="82"  width="38" height="4" rx="2" fill="url(#mark)" opacity="0.35"/>
  <rect x="42" y="98"  width="50" height="4" rx="2" fill="url(#mark)" opacity="0.65"/>
  <rect x="34" y="114" width="38" height="4" rx="2" fill="url(#mark)" opacity="0.35"/>

  <!-- forward mark (engage / proceed) -->
  <path d="M 100 58 L 172 100 L 100 142 Z" fill="url(#mark)" stroke="url(#mark)" stroke-width="12" stroke-linejoin="round"/>

  <!-- wordmark -->
  <text x="212" y="130" font-family="'Inter','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="86" font-weight="600" letter-spacing="-3" fill="#F8FAFC">engage</text>

  <!-- terminal cursor -->
  <rect x="516" y="82" width="24" height="46" rx="4" fill="#38BDF8" opacity="0.9"/>
</svg>
